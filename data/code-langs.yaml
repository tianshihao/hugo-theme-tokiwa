# data/code-langs.yaml — fenced-code short name → formal display name.
# Used by layouts/_default/_markup/render-codeblock.html for the top-left
# language badge ("cpp" → "C++", "py" → "Python", ...). Keys are lowercase;
# an unknown name falls back to the raw fence text. `data-lang` still carries
# the short name so the TextMate engine can look up its grammar.

