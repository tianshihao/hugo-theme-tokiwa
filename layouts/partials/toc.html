{{ if (.Params.toc) }}
<div id="toc-body" class="toc-body toc-open" data-toc-body>
    <hr class="toc-line toc-line-top" />
    <div class="toc-content font-serif">
        {{.TableOfContents}}
    </div>
    <hr class="toc-line toc-line-bottom" />
</div>
<style>
    /* The shamrock sits in the MIDDLE of the tags/date row. The row (in
       page-header.html) is a flex line where the tags and the date share the
       space equally (both flex-grow), so the fixed-width ☘ lands exactly
       centred: tags | ☘ | date, all on one line. The tags are kept on that
       single line too (white-space: nowrap + ellipsis) — nobody writes a
       novel's worth of tags. */
    .toc-row > div {
        flex: 1 1 0;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left; /* override the header's inherited md:text-right so
                             the tags stay flush left */
        padding-right: 1rem; /* mirrors the date's pl-4 so the two sides are
                                equal-width and the ☘ is exactly centred */
    }
    .toc-row > time {
        flex: 1 1 0;
        min-width: 0;
        text-align: right;
    }
    .toc-clover {
        flex: 0 0 auto;
        background: none;
        border: none;
        padding: 0 0.6rem;
        cursor: pointer;
        color: #4eab90;   /* eucalyptus-400 — same teal as the footer ❧ */
        font-family: serif;
        font-size: 24px;
        line-height: 1;
    }
    .toc-clover:hover {
        color: #49beb7;
    }

    /* Every time the TOC toggles (☘ click or za) the shamrock spins a few
       quick turns over the same 0.35s as the divider-line sweep, so the whole
       open/close feels like one gesture. JS re-adds this class per toggle and
       removes it on animationend, so rapid toggles restart it cleanly. */
    @keyframes toc-clover-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(1080deg); } /* three full turns */
    }
    .toc-clover-spin {
        animation: toc-clover-spin 0.35s cubic-bezier(0, .5, 0, 1);
    }

    /* Vertical rhythm: one uniform gap between the article-title, the
       tags/date row, the two divider lines and the ← Back link. The row and
       the back link get a normal line-height (the header inherits
       leading-loose, which inflates their boxes) so the rhythm is predictable.
       The back link's own top margin is the gap below the bottom line AND the
       collapsed gap below the row, so the two states match. */
    :root {
        --header-gap: 8px;
    }
    .toc-row {
        line-height: 1.5;
        /* a touch more after the big article title — its line box carries
           leading below the glyphs, so this lands the visible gap on the same
           --header-gap as everywhere else */
        margin-top: calc(var(--header-gap) + 6px);
    }

    /* The ← Back link: normal line-height + the uniform gap above it (covers
       both the open state below the bottom line and the collapsed state below
       the row). The bottom-anchored hover underline would float ~0.7px below
       the 16px serif glyph (24px line box); nudge it up so it hugs the text
       exactly like every inline link (site-wide underline distance = 0).
       `a` prefix is required: `a:not(.icon)` (0,1,1) would otherwise override
       the bare attribute selector (0,1,0). */
    a[data-article-back] {
        display: inline-block;
        line-height: 1.5;
        margin-top: var(--header-gap);
        background-position: 0 calc(100% - 0.7px);
    }

    /* The TOC body is collapsed until the ☘ is clicked — the header row is
       just tags | ☘ | date until you open the TOC. */
    .toc-body:not(.toc-open) .toc-content {
        display: none;
    }

    /* JS auto-hides the TOC on very short viewports (less than one line
       would fit). Transient visual state — it never touches the user's
       open/close choice or the persisted value. */
    .toc-body.toc-autohide {
        display: none !important;
    }

    /* On load the TOC must match the za-persisted global state with no flash
       or animation: a head script marks <html> when the saved state is
       collapsed, hiding the body from the very first paint (before the JS that
       applies the state runs). */
    html.toc-init-collapsed .toc-body {
        display: none !important;
    }

    /* The two divider lines frame the TOC: each is a 1px line that sweeps out
       from the centre (background-size 0 → 100% at background-position center,
       the same sweep as the theme's link underlines) while its box grows from
       0 height — opening shoots both lines out of the ☘, closing reels them
       back in. Collapsed they take no vertical space. */
    .toc-line {
        position: relative;
        border: none;
        height: 0;
        margin: 0;
        background-image: linear-gradient(#9acfbf, #9acfbf);
        background-repeat: no-repeat;
        background-position: center;
        background-size: 0 1px;
        transition: height 0.35s cubic-bezier(0, .5, 0, 1),
                    margin 0.35s cubic-bezier(0, .5, 0, 1),
                    background-size 0.35s cubic-bezier(0, .5, 0, 1);
    }
    .toc-body.toc-open .toc-line {
        height: 5px;
        margin: var(--header-gap) 0;
        background-size: 100% 1px;
    }
    /* The bottom line only adds the gap above it (content → line); the gap
       below it is the back link's own top margin, so open and collapsed agree. */
    .toc-body.toc-open .toc-line-bottom {
        margin-top: var(--header-gap);
        margin-bottom: 0;
    }

    .toc-content nav li,
    .toc-content nav li a {
        line-height: 1.6 !important;
    }

    /* The TOC is a "window": its height is capped by JS to the live gap between
       its own top and the aside's top, so it never grows past the aside. The
       content scrolls inside that window (scrollbar hidden — wheel / trackpad /
       the scrollspy all still scroll it, just no visible bar), and
       overscroll-behavior keeps a wheel over the TOC from also scrolling the
       page underneath. */
    .toc-content {
        display: block;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: none;   /* Firefox */
        -ms-overflow-style: none; /* legacy Edge/IE */
        /* scrollspy chase: when the active link changes, the window glides to
           keep it centred instead of jumping */
        scroll-behavior: smooth;
        /* when the TOC opens, the window grows from 0 to its cap in sync with
           the divider-line sweep, instead of popping in afterwards */
        transition: max-height 0.35s cubic-bezier(0, .5, 0, 1);
    }
    .toc-content::-webkit-scrollbar {
        display: none;           /* Chromium / Safari */
    }

    /* The heading currently being read — same teal pill language as the
       vim-active highlights across the site. */
    .toc-content nav a.toc-active {
        color: #028760;
        background-color: rgba(2, 135, 96, 0.14);
        border-radius: 3px;
    }
</style>
{{ end }}
