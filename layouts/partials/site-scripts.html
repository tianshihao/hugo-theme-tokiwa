{{ $script := .Site.Data.webpack_assets.app }}
{{ with $script.js }}
<script src="{{ relURL (printf "%s%s" "dist/" .) }}"></script>
{{ end }}
{{ if .Site.Params.fuse }}
<script src="/lib/fuse.min.js"></script> <!-- download and copy over fuse.min.js file from fusejs.io -->
<script src="/lib/fastsearch.js"></script>
{{ end }}

<script>
	/* ---- shared label font ------------------------------------------------
	   One shared "label" font across the posts year label and the tags drop-cap
	   label. The label glyph should be exactly two lines of the shared list/title
	   text tall (2 × --list-line-height). We measure the label font's glyph
	   height-to-font-size ratio once, derive the font-size from it, and publish it
	   as --label-font-size so both pages use the same value. */
	function measureGlyphRatio() {
		var label = document.querySelector('[data-home-tag-name]') ||
		            document.querySelector('[data-home-archive-year]');
		if (!label) {
			return 1.42;
		}
		var probe = document.createElement('span');
		probe.textContent = 'M';
		probe.setAttribute('aria-hidden', 'true');
		probe.style.cssText =
			'position:absolute;visibility:hidden;pointer-events:none;white-space:nowrap;' +
			'font-family:' + getComputedStyle(label).fontFamily + ';' +
			'font-size:100px;line-height:1;';
		document.body.appendChild(probe);
		var range = document.createRange();
		range.selectNodeContents(probe);
		var ratio = range.getBoundingClientRect().height / 100;
		document.body.removeChild(probe);
		return ratio || 1.42;
	}

	function syncLabelFontSize() {
		var listLh = parseFloat(getComputedStyle(document.documentElement)
			.getPropertyValue('--list-line-height')) || 26;
		var size = (2 * listLh) / measureGlyphRatio();
		document.documentElement.style.setProperty('--label-font-size', size.toFixed(1) + 'px');
	}

	/* ---- taxonomy card design constants ----------------------------------
	   Shared design values for the taxonomy cards. The content↔divider centering
	   (align()) and the vim highlight (taxMeasureBounds()) must agree on these,
	   so they live here as a single source of truth — never redefine them inline. */
	var TAXONOMY_DESIGN = {
		GAP: 13, /* content → divider gap; what centers content between dividers */
		PAD: 2   /* vim highlight breathing room beyond the content's own GAP */
	};

	/* ---- home & posts one-screen pagination ------------------------------
	   Home, posts and taxonomy term pages fit their list to a single screen:
	   buildPagesByHeight() groups items into pages by available height,
	   buildNumberButtons() rebuilds the pager, applyPostsHeightLimit() caps the
	   list's height, and pinBottomRails() freezes the aside + footer to the
	   viewport bottom. Exposed as oneScreenPage.boot() / .teardown() so the nav
	   live-preview can re-boot it after swapping in a new main + footer. */
	var oneScreenPage = (function () {
		var MIN_ITEMS_PER_PAGE = 3;
		var yearMinContent = null; /* 5.125rem, captured once so our inline styles don't pollute it */
		var yearPadRight = null;   /* 1rem */
		var desktopMedia = window.matchMedia('(min-width: 768px)');

		/* elements are re-captured on every boot() so a dynamically-loaded main
		   or footer is picked up (after a swap the pager anchors are fresh
		   nodes, so their click handlers are re-wired too) */
		var main, homeHeaderTitle, homeAside, homeFooter, postsContainer, footer;
		var items = [];
		var pagerHr, pagerUl, firstAnchor, prevAnchor, nextAnchor, lastAnchor;
		var pagesHost, firstLi, prevLi, nextLi, lastLi;
		var pages = [], currentPage = 0, pageButtons = [], rafId = 0;
		var active = false;

		function capture() {
			main = document.querySelector('[data-home-main]');
			homeHeaderTitle = document.querySelector('[data-site-title]');
			homeAside = document.querySelector('[data-home-aside]');
			homeFooter = document.querySelector('[data-home-footer]');
			postsContainer = document.querySelector('[data-home-posts-container]');
			footer = document.querySelector('footer');
			items = Array.prototype.slice.call(document.querySelectorAll('[data-home-post-item]'));
			pagerHr = document.querySelector('[data-home-pager-hr]');
			pagerUl = document.querySelector('[data-home-pager]');
			firstAnchor = pagerUl ? pagerUl.querySelector('[data-home-first]') : null;
			prevAnchor = pagerUl ? pagerUl.querySelector('[data-home-prev]') : null;
			nextAnchor = pagerUl ? pagerUl.querySelector('[data-home-next]') : null;
			lastAnchor = pagerUl ? pagerUl.querySelector('[data-home-last]') : null;
			pagesHost = pagerUl ? pagerUl.querySelector('[data-home-pages]') : null;
			firstLi = firstAnchor ? firstAnchor.closest('li') : null;
			prevLi = prevAnchor ? prevAnchor.closest('li') : null;
			nextLi = nextAnchor ? nextAnchor.closest('li') : null;
			lastLi = lastAnchor ? lastAnchor.closest('li') : null;
			active = !!(main && postsContainer && footer && items.length && pagerUl &&
				homeAside && homeFooter && homeHeaderTitle && firstAnchor && prevAnchor &&
				nextAnchor && lastAnchor && pagesHost && firstLi && prevLi && nextLi && lastLi);
			return active;
		}

		/* undo boot()'s effects (fixed rails, height cap, hidden items) so the
		   page returns to its natural scroll before another page is loaded */
		function teardown() {
			if (!active) { return; }
			active = false;
			if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
			clearFixedRails();
			if (postsContainer) {
				postsContainer.style.maxHeight = '';
				postsContainer.style.overflow = '';
			}
			items.forEach(function (item) {
				item.classList.remove('home-fit-hidden');
			});
		}

		function showPager(shouldShow) {
			pagerUl.classList.toggle('hidden', !shouldShow);
			if (pagerHr) {
				pagerHr.classList.toggle('hidden', !shouldShow);
			}
		}

		function resetVisibility() {
			items.forEach(function (item) {
				item.classList.remove('home-fit-hidden');
			});
		}

		function getTargetBottomGap() {
			var raw = getComputedStyle(document.documentElement).getPropertyValue('--aside-gap');
			var v = parseInt(raw, 10);
			return Number.isNaN(v) ? 34 : v;
		}

		function clearFixedRails() {
			homeAside.style.position = '';
			homeAside.style.left = '';
			homeAside.style.width = '';
			homeAside.style.bottom = '';
			homeAside.style.marginBottom = '';
			homeAside.style.transform = '';
			homeAside.style.zIndex = '';

			homeFooter.style.position = '';
			homeFooter.style.left = '';
			homeFooter.style.width = '';
			homeFooter.style.bottom = '';
			homeFooter.style.marginBottom = '';
			homeFooter.style.transform = '';
			homeFooter.style.zIndex = '';
		}

		function pinBottomRails() {
			if (!desktopMedia.matches) {
				clearFixedRails();
				return;
			}

			clearFixedRails();
			var bottomGap = getTargetBottomGap();
			var asideRect = homeAside.getBoundingClientRect();
			var footerRect = homeFooter.getBoundingClientRect();

			homeAside.style.position = 'fixed';
			homeAside.style.left = String(Math.round(asideRect.left)) + 'px';
			homeAside.style.width = String(Math.round(asideRect.width)) + 'px';
			homeAside.style.bottom = String(bottomGap) + 'px';
			homeAside.style.zIndex = '20';

			homeFooter.style.position = 'fixed';
			homeFooter.style.left = String(Math.round(footerRect.left)) + 'px';
			homeFooter.style.width = String(Math.round(footerRect.width)) + 'px';
			homeFooter.style.bottom = String(bottomGap) + 'px';
			homeFooter.style.zIndex = '20';
		}

		function applyPostsHeightLimit() {
			if (!desktopMedia.matches) {
				postsContainer.style.maxHeight = '';
				postsContainer.style.overflow = '';
				return;
			}

			var postsTop = postsContainer.getBoundingClientRect().top;
			var footerHeight = Math.ceil(homeFooter.getBoundingClientRect().height);
			var footerBottomGap = getTargetBottomGap();
			var available = Math.floor(window.innerHeight - postsTop - footerHeight - footerBottomGap - 12);
			if (available < 0) {
				available = 0;
			}

			postsContainer.style.maxHeight = String(available) + 'px';
			postsContainer.style.overflow = 'hidden';
		}

		function fitsMainHeight() {
			return postsContainer.scrollHeight <= (postsContainer.clientHeight + 4);
		}

		function setDisabled(anchor, disabled) {
			var li = anchor.parentElement;
			if (li) {
				li.classList.toggle('disabled', disabled);
			}
		}

		/* the maximum number of page-number slots (including ellipsis) the
		   pager can show at once, derived from the actual width — the count
		   adapts to the viewport instead of being hardcoded. The pager grid
		   reserves 4 × 2rem for the arrows and 4 × 0.5rem column gaps; each
		   slot is a page number (up to 2 digits) plus the 1.25rem gap between
		   numbers. Bounded to a sane range: never below 5 (so the classic
		   1 … cur … last layout always fits) and never above 9. */
		function computeMaxSlots() {
			var pager = pagerUl;
			if (!pager) {
				return 7;
			}
			var pr = pager.getBoundingClientRect();
			var fixed = 4 * 32 + 4 * 8;      /* 4 × 2rem + 4 × 0.5rem column gaps */
			var available = Math.max(0, pr.width - fixed);
			var slotGap = 20;                /* the [data-home-pages] gap, 1.25rem */
			var twoDigit = 20;               /* a 2-digit serif page number */
			var n = Math.floor((available + slotGap) / (twoDigit + slotGap));
			return Math.max(5, Math.min(n, 9));
		}

		function buildNumberButtons() {
			pagesHost.innerHTML = '';
			pageButtons = [];
			if (!pages.length) {
				return;
			}

			/* how many page-number slots (including ellipsis) the pager may
			   occupy at once, computed from the current width (computeMaxSlots).
			   The ellipsis hides pages ONLY when there are more pages than this —
			   with exactly this many pages every number is shown, because turning
			   one of them into an ellipsis would still leave the same number of
			   slots (just strictly less info). So the ellipsis kicks in at
			   total == MAX_SLOTS + 1, not at total == MAX_SLOTS. */
			var MAX_SLOTS = computeMaxSlots();
			var total = pages.length;
			var cur = currentPage + 1; /* 1-based */
			var slots = [];            /* page numbers, or '...' for a hidden run */

			if (total <= MAX_SLOTS) {
				for (var s = 1; s <= total; s += 1) {
					slots.push(s);
				}
			} else {
				/* first and last are always shown; a window around the current
				   page fills the rest and hidden runs collapse to '...'. The
				   window shrinks until everything fits in MAX_SLOTS, keeping the
				   current page visible. */
				var lo = Math.max(2, cur - 1);
				var hi = Math.min(total - 1, cur + 1);
				while (true) {
					var cand = [];
					if (lo > 2) { cand.push(1, '...'); } else { cand.push(1); }
					for (var p = lo; p <= hi; p += 1) { cand.push(p); }
					if (hi < total - 1) { cand.push('...', total); } else { cand.push(total); }
					if (cand.length <= MAX_SLOTS) {
						slots = cand;
						break;
					}
					if (hi > cur && lo < cur) {
						/* both sides have room: drop from the wider hidden gap */
						if (lo - 1 >= total - 1 - hi) { lo += 1; } else { hi -= 1; }
					} else if (hi > cur) {
						hi -= 1;
					} else if (lo < cur) {
						lo += 1;
					} else {
						slots = cand; /* window is just [cur]; nothing to drop */
						break;
					}
				}
			}

			var lastWasEllipsis = false;
			for (var j = 0; j < slots.length; j += 1) {
				var slot = slots[j];
				if (slot === '...') {
					if (!lastWasEllipsis) {
						var ellipsisLi = document.createElement('li');
						ellipsisLi.className = 'page-item disabled';
						ellipsisLi.textContent = '...';
						pagesHost.appendChild(ellipsisLi);
						lastWasEllipsis = true;
					}
					continue;
				}
				lastWasEllipsis = false;

				var li = document.createElement('li');
				li.className = 'page-item';
				var a = document.createElement('a');
				a.className = 'page-link';
				a.href = '#';
				a.textContent = String(slot);
				a.setAttribute('data-home-page-index', String(slot - 1));
				a.addEventListener('click', function (event) {
					event.preventDefault();
					var raw = event.currentTarget.getAttribute('data-home-page-index');
					var idx = Number(raw);
					if (!Number.isNaN(idx)) {
						renderPage(idx);
					}
				});
				li.appendChild(a);
				pagesHost.appendChild(li);
				pageButtons.push(li);
			}
		}

		function updatePagerUi() {
			if (!pages.length) {
				setDisabled(firstAnchor, true);
				setDisabled(prevAnchor, true);
				setDisabled(nextAnchor, true);
				setDisabled(lastAnchor, true);
				return;
			}

			setDisabled(firstAnchor, currentPage <= 0);
			setDisabled(prevAnchor, currentPage <= 0);
			setDisabled(nextAnchor, currentPage >= pages.length - 1);
			setDisabled(lastAnchor, currentPage >= pages.length - 1);

			pageButtons.forEach(function (li) {
				var a = li.querySelector('a[data-home-page-index]');
				if (!a) {
					return;
				}
				var idx = Number(a.getAttribute('data-home-page-index'));
				li.classList.toggle('active', idx === currentPage);
			});
		}

		function updateYearLabels() {
			var prevYear = null;
			var firstVisible = true;
			items.forEach(function (item) {
				var yearEl = item.querySelector('[data-home-archive-year]');
				if (!yearEl) {
					return;
				}
				if (item.classList.contains('home-fit-hidden')) {
					return;
				}
				var year = item.getAttribute('data-home-post-year');
				var show = firstVisible || year !== prevYear;
				yearEl.textContent = show ? year : '';
				var divider = item.querySelector('[data-home-archive-divider]');
				if (divider) {
					divider.style.display = show ? 'block' : 'none';
				}
				firstVisible = false;
				prevYear = year;
			});
		}

		/* Couple the description rows to the real title-row geometry so they stay
		   aligned even if the year/date/title font-size, family or line-height
		   changes. Measures the actual year/date column widths and the title's
		   vertical centering, then derives the desc row's bottom padding so that
		   desc -> next divider always equals divider -> first title. */
		function syncDescriptionRows() {
			var sample = null;
			for (var i = 0; i < items.length; i += 1) {
				if (!items[i].classList.contains('home-fit-hidden')) {
					sample = items[i];
					break;
				}
			}
			if (!sample) {
				return;
			}

			var yearEl = sample.querySelector('[data-home-archive-year]');
			var dateEl = sample.querySelector('[data-home-archive-date]');
			var titleLink = sample.querySelector('a[data-home-archive-title]');
			if (!yearEl || !dateEl || !titleLink) {
				return;
			}

			/* Uniform year column. It must be as wide as the widest year text at
			   the current font AND identical across every row, so date/title stay
			   aligned between group-start rows (year text shown) and continuation
			   rows (year text cleared) even when the year font is enlarged. The
			   glyph width is measured via a text range (independent of box sizing)
			   and the CSS min-width/padding are captured once so our own inline
			   styles can't pollute the measurement. */
			var dateWidth = 0;
			var maxYearGlyph = 0;
			if (yearMinContent === null && sample) {
				var yearProbe = sample.querySelector('[data-home-archive-year]');
				if (yearProbe) {
					yearMinContent = parseFloat(getComputedStyle(yearProbe).minWidth) || 0;
					yearPadRight = parseFloat(getComputedStyle(yearProbe).paddingRight) || 0;
				}
			}
			items.forEach(function (item) {
				if (item.classList.contains('home-fit-hidden')) {
					return;
				}
				var yEl = item.querySelector('[data-home-archive-year]');
				var dEl = item.querySelector('[data-home-archive-date]');
				if (yEl) {
					var range = document.createRange();
					range.selectNodeContents(yEl);
					maxYearGlyph = Math.max(maxYearGlyph, range.getBoundingClientRect().width);
				}
				if (dEl) {
					dateWidth = Math.max(dateWidth, dEl.getBoundingClientRect().width);
				}
			});
			/* border-box value: min-width is already border-box (global reset),
			   so the column is whichever is wider — the design min-width or the
			   widest year glyph plus its right padding. */
			var yearWidth = Math.max(yearMinContent, maxYearGlyph + yearPadRight);
			items.forEach(function (item) {
				if (item.classList.contains('home-fit-hidden')) {
					return;
				}
				var yEl = item.querySelector('[data-home-archive-year]');
				if (!yEl) {
					return;
				}
				yEl.style.boxSizing = 'border-box';
				yEl.style.minWidth = yearWidth + 'px';
			});

			/* Gap from the divider above the first visible item to that item's
			   title TEXT (glyph) top. Each desc row's bottom padding is derived
			   so its own text (glyph) bottom keeps the same gap to the divider
			   below — stays correct under any font-size / family / line-height. */
			var dividerEl = sample.querySelector('[data-home-archive-divider]');
			if (!dividerEl || getComputedStyle(dividerEl).display === 'none') {
				return; /* divider not rendered yet; a later call will fix it */
			}
			var dividerRect = dividerEl.getBoundingClientRect();
			var titleRange = document.createRange();
			titleRange.selectNodeContents(titleLink);
			var gapAbove = titleRange.getBoundingClientRect().top - dividerRect.bottom;
			var dividerMarginTop = parseFloat(getComputedStyle(dividerEl).marginTop) || 0;

			items.forEach(function (item) {
				if (item.classList.contains('home-fit-hidden')) {
					return;
				}
				var descRow = null;
				Array.prototype.forEach.call(item.children, function (child) {
					if (!descRow && child.querySelector('.text-gray-600')) {
						descRow = child;
					}
				});
				if (!descRow) {
					return;
				}
				var spans = descRow.querySelectorAll('span');
				if (spans.length >= 2) {
					spans[0].style.boxSizing = 'border-box';
					spans[0].style.minWidth = yearWidth + 'px';
					spans[0].style.width = yearWidth + 'px';
					spans[1].style.boxSizing = 'border-box';
					spans[1].style.minWidth = dateWidth + 'px';
					spans[1].style.width = dateWidth + 'px';
				}
				var descDiv = descRow.querySelector('.text-gray-600');
				var descRange = document.createRange();
				descRange.selectNodeContents(descDiv);
				var descGlyphBottom = descRange.getBoundingClientRect().bottom;
				var descBoxBottom = descDiv.getBoundingClientRect().bottom;
				var descInset = descBoxBottom - descGlyphBottom;
				if (descInset < 0) {
					descInset = 0;
				}
				var pad = gapAbove - dividerMarginTop - descInset;
				descRow.style.paddingBottom = (pad < 0 ? 0 : pad) + 'px';
			});
		}

		function setVisibleRange(start, end) {
			for (var idx = 0; idx < items.length; idx += 1) {
				var inRange = idx >= start && idx < end;
				items[idx].classList.toggle('home-fit-hidden', !inRange);
			}
			updateYearLabels();
		}

		function renderPage(index) {
			if (!pages.length) {
				resetVisibility();
				updateYearLabels();
				updatePagerUi();
				pinBottomRails();
				applyPostsHeightLimit();
				syncDescriptionRows();
				return;
			}

			if (index < 0) {
				index = 0;
			}
			if (index >= pages.length) {
				index = pages.length - 1;
			}
			currentPage = index;
			setVisibleRange(pages[currentPage].start, pages[currentPage].end);
			updateYearLabels();
			buildNumberButtons();
			updatePagerUi();
			syncDescriptionRows();

			if (desktopMedia.matches) {
				window.requestAnimationFrame(function () {
					window.requestAnimationFrame(function () {
						pinBottomRails();
						applyPostsHeightLimit();
					});
				});
			}
		}

		function buildPagesByHeight() {
			syncLabelFontSize();
			pages = [];
			resetVisibility();
			pageButtons = [];
			pagesHost.innerHTML = '';
			if (!desktopMedia.matches) {
				pinBottomRails();
				postsContainer.style.maxHeight = '';
				postsContainer.style.overflow = '';
				showPager(false);
				resetVisibility();
				updateYearLabels();
				updatePagerUi();
				syncDescriptionRows();
				return;
			}

			showPager(true);
			pinBottomRails();
			applyPostsHeightLimit();
			var start = 0;
			while (start < items.length) {
				var end = start;
				setVisibleRange(start, end);

				while (end < items.length) {
					end += 1;
					setVisibleRange(start, end);
					if (!fitsMainHeight()) {
						end -= 1;
						break;
					}
				}

				var minEnd = Math.min(start + MIN_ITEMS_PER_PAGE, items.length);
				if (end < minEnd) {
					end = minEnd;
					setVisibleRange(start, end);
				}

				if (end <= start) {
					end = start + 1;
				}

				pages.push({ start: start, end: end });
				start = end;
			}

			if (currentPage >= pages.length) {
				currentPage = pages.length - 1;
			}
			renderPage(currentPage);
			pinBottomRails();
			applyPostsHeightLimit();
		}

		function gotoFirstPage() {
			renderPage(0);
		}

		function gotoPrevPage() {
			if (currentPage > 0) {
				renderPage(currentPage - 1);
			}
		}

		function gotoNextPage() {
			if (currentPage < pages.length - 1) {
				renderPage(currentPage + 1);
			}
		}

		function gotoLastPage() {
			if (pages.length > 0) {
				renderPage(pages.length - 1);
			}
		}

		var rafId = 0;
		function scheduleRebuild() {
			if (rafId) {
				window.cancelAnimationFrame(rafId);
			}
			rafId = window.requestAnimationFrame(buildPagesByHeight);
		}

		var wired = false;
		function boot() {
			if (!capture()) {
				return;
			}
			/* every load / re-load of a one-screen list starts at page 0: the nav
			   live-preview swaps home ↔ posts ↔ term in place, and the paginator
			   must NOT carry the previous page's position across — home on page 5
			   loading posts must show posts page 1, not inherit page 5. (A later
			   restoreCursor() can bring back a saved page number for a vim-return.) */
			currentPage = 0;
			firstAnchor.setAttribute('href', '#');
			prevAnchor.setAttribute('href', '#');
			nextAnchor.setAttribute('href', '#');
			lastAnchor.setAttribute('href', '#');
			if (pagerHr) {
				pagerHr.style.display = '';
			}
			/* the pager anchors are fresh nodes after a content swap, so their
			   click handlers must be re-wired on every boot; the window / media
			   listeners are wired once (they only schedule a rebuild, which is
			   cheap and deduped by rafId) */
			firstAnchor.addEventListener('click', function (event) {
				event.preventDefault();
				gotoFirstPage();
			});
			prevAnchor.addEventListener('click', function (event) {
				event.preventDefault();
				gotoPrevPage();
			});
			nextAnchor.addEventListener('click', function (event) {
				event.preventDefault();
				gotoNextPage();
			});
			lastAnchor.addEventListener('click', function (event) {
				event.preventDefault();
				gotoLastPage();
			});
			if (!wired) {
				wired = true;
				document.addEventListener('DOMContentLoaded', scheduleRebuild);
				window.addEventListener('load', scheduleRebuild);
				window.addEventListener('resize', scheduleRebuild);
				if (desktopMedia.addEventListener) {
					desktopMedia.addEventListener('change', scheduleRebuild);
				} else if (desktopMedia.addListener) {
					desktopMedia.addListener(scheduleRebuild);
				}
				if (document.fonts && document.fonts.ready) {
					document.fonts.ready.then(scheduleRebuild);
				}
			}
			scheduleRebuild();
		}

		/* the current page index, so the vim return can save which page a list
		   was on and restore it later */
		function currentPageIndex() {
			return currentPage;
		}

		/* switch to a saved page (h returning to a list restores the page the
		   item was on, not just the item) */
		function restorePage(page) {
			if (!pages.length) {
				return;
			}
			renderPage(page);
		}

		return { boot: boot, teardown: teardown, currentPageIndex: currentPageIndex,
			restorePage: restorePage };
	})();

	/* ---- taxonomy cards: divider centering & long-tag fit ----------------
	   Taxonomy cards (tags waterfall + series/categories list): keep each card's
	   content vertically centered between its divider and the next card's divider
	   (uniform text→divider gap = GAP on both sides), and center a single line of
	   titles vertically on the big tag label.

	   The drop-cap tag is exactly two title lines tall and always starts at the
	   card's content top, so the visible text extent is:
	     - 1 line   → top = tag top,  bottom = tag bottom   (title centered on tag)
	     - 2 lines  → top = tag top,  bottom = tag bottom   (== 2nd title line)
	     - 3+ lines → top = tag top,  bottom = last line
	   In every case align() re-pads so text→own divider == text→next divider
	   == GAP, i.e. the content sits centered between the two dividers. Exposed as
	   taxonomyCards.boot() so the nav live-preview re-aligns the cards after
	   swapping in a new taxonomy main. */
	var taxonomyCards = (function () {
		/* The design gap (px) between the content's visible text and each of the
		   two dividers that bound it: the card's own divider above and the next
		   card's divider below. Aligning BOTH gaps to GAP is what centers the
		   content between the dividers. Column-end cards (no next divider) only
		   pin the top gap to GAP. Sourced from TAXONOMY_DESIGN (single source)
		   so the vim highlight in taxMeasureBounds always agrees. */
		var GAP = TAXONOMY_DESIGN.GAP;
		var pins = [];   /* re-captured on every rebuild (cards are fresh after a swap) */
		var wired = false;

		function rangeRect(el) {
			var r = document.createRange();
			r.selectNodeContents(el);
			return r.getBoundingClientRect();
		}

		function align() {
			pins.forEach(function (pin, i) {
				var div = pin.querySelector('[data-home-tag-divider]');
				var content = pin.querySelector('.tag-card-content');
				var tag = pin.querySelector('[data-home-tag-name]');
				var titlesWrap = pin.querySelector('.tag-card-titles');
				if (!div || !content || !tag || !titlesWrap) {
					return;
				}

				/* reset a previous run's adjustments so we measure the natural box */
				titlesWrap.style.display = '';
				titlesWrap.style.transform = '';
				content.style.paddingTop = '';
				content.style.paddingBottom = '';

				var pinTop = pin.getBoundingClientRect().top;
				var pinLeft = pin.getBoundingClientRect().left;
				var cs = getComputedStyle(content);
				var padT = parseFloat(cs.paddingTop) || 0;
				var padB = parseFloat(cs.paddingBottom) || 0;
				var contentH = content.getBoundingClientRect().height - padT - padB;

				var tagR = rangeRect(tag);
				var links = Array.prototype.slice.call(pin.querySelectorAll('.tag-card-titles > a'));
				var firstR = links.length ? rangeRect(links[0]) : tagR;
				var lastR = links.length ? rangeRect(links[links.length - 1]) : tagR;
				var topText = Math.min(tagR.top, firstR.top);
				var bottomText = Math.max(tagR.bottom, lastR.bottom);

				/* divider directly below this card, in the same column */
				var cardBottom = pin.getBoundingClientRect().bottom;
				var nextDiv = null;
				for (var j = i + 1; j < pins.length; j++) {
					var cand = pins[j].querySelector('[data-home-tag-divider]');
					var candRect = cand ? cand.getBoundingClientRect() : null;
					if (candRect && candRect.top > cardBottom && Math.abs(candRect.left - pinLeft) < 5) {
						nextDiv = cand;
						break;
					}
				}

				/* center the content's text extent between its divider and the next
				   divider: top text → own divider = GAP, bottom text → next = GAP.
				   Column-end cards have no next divider, so only the top gap is
				   pinned (keeps every card's tag label the same distance from its
				   divider, even the last card of a column). */
				var divMarginTop = parseFloat(getComputedStyle(div).marginTop) || 0;
				var divMarginBottom = parseFloat(getComputedStyle(div).marginBottom) || 0;
				var topOffset = topText - (pinTop + divMarginTop + divMarginBottom + padT);
				var newPadTop = Math.max(0, GAP - divMarginBottom - topOffset);
				content.style.paddingTop = newPadTop + 'px';
				if (nextDiv) {
					var nextMarginTop = parseFloat(getComputedStyle(nextDiv).marginTop) || 0;
					var bottomTextOffset = bottomText - (pinTop + divMarginTop + divMarginBottom + padT);
					var newPadBottom = Math.max(0, GAP - contentH - nextMarginTop + bottomTextOffset);
					content.style.paddingBottom = newPadBottom + 'px';
				}

				/* single line of titles: center them vertically on the tag label
				   (a single long title that wraps to two lines is NOT one line).
				   The +2 matches the CSS optical shift on the title link so the
				   font reads as centered and the hover underline sits below it. */
				if (links.length && titlesWrap.getBoundingClientRect().height < 35) {
					var tr = rangeRect(tag);
					var fr = rangeRect(links[0]);
					var tagCenter = (tr.top + tr.bottom) / 2;
					var titlesCenter = (fr.top + fr.bottom) / 2;
					var offset = tagCenter - titlesCenter + 2;
					titlesWrap.style.display = 'inline-block';
					titlesWrap.style.transform = 'translateY(' + offset.toFixed(1) + 'px)';
				}
			});
		}

		/* Long tags would be cut off by the drop-cap max-width; shrink their
		   font-size just enough for the full name to fit, so the label is never
		   truncated with an ellipsis. Short tags keep the full drop-cap size. */
		/* Long tag labels are never shrunk (always full drop-cap size). When a
		   name can't fit, truncate it by whole characters and append the custom
		   ellipsis: measure the real glyph width of text + "..." with a hidden
		   probe, then drop characters from the end one at a time until it fits.
		   Never go below a minimum so at least ~2 CJK chars / 4 letters stay
		   visible (2 × the label font size). */
		function fitLongTags() {
			pins.forEach(function (pin) {
				var tag = pin.querySelector('[data-home-tag-name]');
				var label = tag ? tag.querySelector('.tag-label') : null;
				var a = label ? label.querySelector('a') : null;
				if (!tag || !label || !a) {
					return;
				}

				/* remember the full name so we can re-truncate on every resize;
				   the template's surrounding whitespace is dropped */
				var full = a.getAttribute('data-full-text');
				if (full === null) {
					full = a.textContent.trim();
					a.setAttribute('data-full-text', full);
				}
				a.textContent = full;
				tag.classList.remove('is-truncated');

				/* available width for text + ellipsis = the tag's maximum content
				   width (max-width: 60% of the card), not its current
				   shrink-to-fit width which is smaller for short tags */
				var maxWidth = getComputedStyle(tag).maxWidth;
				var avail;
				if (maxWidth && maxWidth.indexOf('%') !== -1) {
					var card = tag.parentElement;
					avail = card.clientWidth * (parseFloat(maxWidth) / 100);
				} else {
					avail = parseFloat(maxWidth) || tag.clientWidth;
				}
				avail -= parseFloat(getComputedStyle(tag).paddingRight) || 0;

				/* measure real glyph widths at the label font with a probe */
				var cs = getComputedStyle(a);
				var probe = document.createElement('span');
				probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;' +
					'white-space:nowrap;font-size:' + cs.fontSize + ';font-family:' + cs.fontFamily + ';';
				document.body.appendChild(probe);
				function widthOf(str) {
					probe.textContent = str;
					return probe.getBoundingClientRect().width;
				}

				var ellWidth = widthOf('...');
				if (widthOf(full) + ellWidth <= avail + 0.5) {
					document.body.removeChild(probe);
					return; /* fits at full size */
				}

				/* floor: never show less than ~2 CJK chars / 4 letters of text */
				var minTextWidth = 2 * parseFloat(cs.fontSize);
				var text = full;
				while (text.length > 0) {
					var textWidth = widthOf(text);
					if (textWidth + ellWidth <= avail + 0.5) {
						break; /* fits with the ellipsis */
					}
					if (textWidth <= minTextWidth) {
						break; /* at the minimum; CSS clips any sliver */
					}
					text = text.slice(0, -1); /* whole character off the end */
				}
				document.body.removeChild(probe);

				/* the ellipsis is appended to the link text itself, so it is part
				   of the link and gets the hover sweep underline too */
				a.textContent = text + '...';
				tag.classList.add('is-truncated');
			});
		}

		function rebuild() {
			/* re-capture the cards — they are fresh nodes after a content swap */
			var cardsList = document.querySelector('[data-taxonomy-cards]');
			pins = cardsList ? Array.prototype.slice.call(cardsList.children) : [];
			if (!pins.length) {
				return;
			}
			syncLabelFontSize();
			fitLongTags();
			align();
		}

		function boot() {
			rebuild();
			if (!wired) {
				wired = true;
				window.addEventListener('resize', rebuild);
				if (document.fonts && document.fonts.ready) {
					document.fonts.ready.then(rebuild);
				}
			}
		}

		return { boot: boot };
	})();

	/* ---- vim navigation ----------------------------------------------------
	   Vim-style navigation:
	   - g as a leader, then h/p/t/c/s to jump to home / posts / tags /
	     categories / series; gg jumps to the first list row
	   - j / k move a highlight through the post list (home + posts), like
	     Twitter / Zhihu feed navigation; G (shift+g) jumps to the last row,
	     Enter opens the highlighted post, Esc / Ctrl+C exit
	   The first j/k/gg/G always starts at the top row.
	   Ignored while typing in a field or when a modifier key is held; the
	   leader expires after a moment. */
	(function () {
		var leader = false;
		var leaderTimer = null;
		var routes = {
			h: '/',             /* home */
			p: '/posts/',       /* posts */
			t: '/tags/',        /* tags */
			c: '/categories/',  /* categories */
			s: '/series/'       /* series */
		};

		/* the path of the page whose main is currently shown. The nav
		   live-preview swaps content in place without navigating, so the URL
		   stays put but this tracks which page the user is actually looking at —
		   used by currentNavIndex() so h returns to the right nav item. It is
		   normalized (no trailing slash, home = '/') so a saved vim-return path
		   always matches the URL form used in comparisons; a raw pathname would
		   carry a trailing slash on real pages and break that matching. */
		var effectivePath = normalizePath(window.location.pathname);

		/* The home and posts lists render rows with different shapes, so the
		   content a row's selection card should wrap — and the link Enter opens
		   — differ per page. The config is re-derived live (not captured once)
		   because the nav live-preview swaps home/posts content in place: the
		   archive rows appear on home after a preview, so the row shape must
		   follow whatever main currently shows, not what the URL says. */
		function isPostsContent() {
			return !!document.querySelector('a[data-home-archive-title]');
		}
		/* Checked live on every key (not once at load) so a late-rendered
		   taxonomy list or an outdated cached copy can't desync the routing.
		   All three taxonomy pages (tags / categories / series) share the
		   [data-taxonomy-cards] container and the same card markup, so one
		   check covers them all; only tags adds the two-column .waterfall. */
		function isTaxonomy() {
			return !!document.querySelector('[data-taxonomy-cards] > section');
		}
		function currentListConfig() {
			return isPostsContent() ? {
				/* posts rows: the date + title (+ description); the year column
				   label and the group divider are markers, not row content */
				contentSelectors: ['[data-home-archive-date]',
					'a[data-home-archive-title]', '[data-home-post-desc]'],
				openSelectors: ['a[data-home-archive-title]']
			} : {
				/* home rows: title → description → tags/date (the pb-8 bottom
				   padding is not content) */
				contentSelectors: ['[data-home-post-title]',
					'[data-home-post-desc]', '.flex.flex-wrap.justify-between'],
				openSelectors: ['[data-home-post-title] a', 'a[href]']
			};
		}

		/* Wrap the selection card around the row's content (the min/max of the
		   configured content elements) with a 2px margin, so every row's
		   highlight is identical regardless of divider / padding. */
		function measureBounds(item) {
			var itemR = item.getBoundingClientRect();
			var minTop = Infinity;
			var maxBottom = -Infinity;
			var found = false;
			currentListConfig().contentSelectors.forEach(function (sel) {
				var el = item.querySelector(sel);
				if (el) {
					var r = el.getBoundingClientRect();
					minTop = Math.min(minTop, r.top);
					maxBottom = Math.max(maxBottom, r.bottom);
					found = true;
				}
			});
			if (!found) {
				return { top: 2, bottom: 4 };
			}
			return {
				top: Math.max(1, minTop - itemR.top - 2),
				bottom: Math.max(1, itemR.bottom - maxBottom - 2)
			};
		}

		/* find the link Enter should open, in config order */
		function findOpenLink(item) {
			var cfg = currentListConfig();
			for (var i = 0; i < cfg.openSelectors.length; i += 1) {
				var a = item.querySelector(cfg.openSelectors[i]);
				if (a && a.href) {
					return a;
				}
			}
			return null;
		}

		/* ---- unified cursor engine (makeCursor) ----------------------------
		   A generic selection cursor: the same engine drives the site nav, the
		   posts/home list, the taxonomy cards and the card previews — four panes
		   that can never drift apart. Each pane is a cursor whose selectable
		   siblings come from items() and whose highlight is painted by
		   onSelect(); move / jump / enter / clear are shared:
		     - move(step)   first press starts at the top; edges clamp; an
		                    already-at-edge press is a no-op (no re-scroll)
		     - jump(which)  first / last
		     - enter()      select the item initialIndex() picks (nav: the item
		                    for the current page; elsewhere: the top)
		     - clear()      drop the highlight (and leave the pane)
		   cache: true keeps the item list once (nav never changes), re-querying
		   only when it comes back empty (matches the old navLinks caching). */
		function makeCursor(cfg) {
			var current = null;
			var cache = [];
			var cached = false;

			function items() {
				if (cfg.cache) {
					if (!cached || cache.length === 0) {
						cache = cfg.items();
						cached = true;
					}
					return cache;
				}
				return cfg.items();
			}

			function select(item) {
				if (current) {
					current.classList.remove('vim-active');

				current = item;
				item.classList.add('vim-active');
				if (cfg.onSelect) {
					cfg.onSelect(item);

			function move(step) {
				var list = items();
				if (!list.length) {
					return;
				}
				var idx = current ? list.indexOf(current) : -1;
				var next;
				if (idx === -1) {
					next = 0; /* no selection yet: always start at the top */
				} else {
					next = idx + step;
				}
				if (next < 0) { next = 0; }
				if (next > list.length - 1) { next = list.length - 1; }
				if (current && next === idx) {
					/* already at the edge, pressing outward: keep the selection
					   pinned but let the page glide the rest of the way */
					if (cfg.onEdge) { cfg.onEdge(step, current); }
					return;
				}
				select(list[next]);
			}

			function jump(which) {
				var list = items();
				if (!list.length) {
					return;
				}
				select(list[which === 'first' ? 0 : list.length - 1]);
			}

			function enter() {
				var list = items();
				if (!list.length) {
					return;
				}
				select(list[cfg.initialIndex ? cfg.initialIndex() : 0]);
			}

			function clear() {
				if (current) {
					current.classList.remove('vim-active');
					current = null;
				}
			}

			return { current: function () { return current; }, items: items,
				select: select, move: move, jump: jump, enter: enter, clear: clear };
		}

		/* ---- taxonomy card navigation ---------------------------------------
		   All three taxonomy pages (tags / categories / series) render the same
		   card markup from terms.html; tags adds the two-column .waterfall, the
		   others stay single-column. Each card has a clickable tag label
		   (top-left) and clickable post previews. Navigation is two levels:
		     card level    j/k move between cards, Enter opens the tag, l descends
		     preview level j/k move between the post previews, Enter opens the
		                    post, h / Esc ascends back to the card
		   gg / G jump to the first / last card.
		   [data-taxonomy-cards] > section covers every card on all three pages,
		   so the same navigation just works on tags, categories and series. */
		var cardCursor = makeCursor({
			/* cards: live item list; measured divider-rhythm overlay */
			items: taxCards,
			onSelect: function (card) {
				var b = taxMeasureBounds(card);
				card.style.setProperty('--hl-top', b.top + 'px');
				card.style.setProperty('--hl-bottom', b.bottom + 'px');
				/* center the selected card's tag pill on its highlight box, and
				   reset the others (their pill kept a shifted top from an
				   earlier selection) */
				Array.prototype.forEach.call(document.querySelectorAll('[data-home-tag-name] .tag-label'), function (el) {
					el.style.position = '';
					el.style.top = '';

				}

				}
			}
		});

		function taxCards() {
			return Array.prototype.slice.call(document.querySelectorAll('[data-taxonomy-cards] > section'))
				.filter(function (el) { return el.offsetParent !== null; });
		}

		function taxPreviews(card) {
			return Array.prototype.slice.call(card.querySelectorAll('.tag-card-titles > a'))

		function taxMeasureBounds(card) {
			var cardR = card.getBoundingClientRect();
			var div = card.querySelector('[data-home-tag-divider]');
			/* The divider line's offset from the card's top edge. The NEXT card's
			   divider sits at the same offset below the card's bottom edge
			   (consecutive pins are flush in a column and share the same divider
			   CSS), so both dividers that bound this card are located purely from
			   this one measured value — no searching needed. */
			var divLine = div ? (div.getBoundingClientRect().bottom - cardR.top) : 9;

			/* The card design centers the content between its divider and the next
			   divider (see align(): GAP on each side). Mirroring that rhythm —
			   keeping the same distance from each divider — makes the highlight
			   box identical for every card, no matter how tall the content is,
			   and keeps the divider lines just outside the box. inset = GAP − PAD
			   is the box→divider distance; PAD is the breathing room the box adds
			   beyond the content's own GAP. */
			/* Single source of truth: GAP / PAD are defined once in TAXONOMY_DESIGN
			   and shared with align()'s content centering, so the highlight can
			   never drift from the divider rhythm. */
			var inset = TAXONOMY_DESIGN.GAP - TAXONOMY_DESIGN.PAD;

			/* Safety: keep the box from ever cutting into the content. */
			var minTop = Infinity;
			var maxBottom = -Infinity;
			var found = false;
			[card.querySelector('[data-home-tag-name]'),
				card.querySelector('.tag-card-titles')].forEach(function (el) {
				if (el) {
					var r = el.getBoundingClientRect();
					minTop = Math.min(minTop, r.top);
					maxBottom = Math.max(maxBottom, r.bottom);
					found = true;
				}
			});

			}
			return {

				bottom: Math.max(1, Math.min(inset - divLine, cardR.bottom - maxBottom))
			};
		}

		/* Vertically center the selected card's tag pill on its highlight box —
		   but ONLY while the preview titles stay beside the label (1-2 lines).
		   The pill is the tag label's own (2-line) box, it keeps its natural
		   size and is never stretched, so centering is a pure translate: move
		   the label so its vertical center lands on the highlight box's center.
		   Once the titles wrap BELOW the label (3+ lines), the box is far taller
		   than the pill and centering would float the tag name over the titles
		   below it — so those cards keep the pill on the label in its natural
		   spot (the pill still uses the same 2-line box as everywhere else; it
		   just does not translate). The shift is applied to .tag-label (the
		   pill's container), NOT the <a>: .tag-label's overflow:hidden would
		   clip a relatively-offset <a> whose background pokes below its box, and
		   the float keeps its layout space either way (a relative offset never
		   reflows the titles). Cleared when the card is deselected / vim mode

		function syncTagPill(card, b) {

			if (!label) {

			}

			var rect = label.getBoundingClientRect();
			var naturalTop = rect.top - cr.top; /* pill top, relative to card top */
			var naturalH = rect.height;         /* pill's natural (unstretched) height */
			var hlTop = b.top;                  /* highlight top, relative to card top */
			var hlBottom = cr.height - b.bottom;/* highlight bottom, relative to card top */
			/* the label here is at its NATURAL position (onSelect reset every
			   pill's shift before calling this), so comparing the titles' extent
			   to the label's own box tells us whether the previews run below the
			   label (3+ lines) or only beside it (1-2 lines) */

			var titlesR = titles ? titles.getBoundingClientRect() : null;
			if (titlesR && titlesR.bottom > rect.bottom + 1) {
				return; /* titles wrap below the label — keep the pill on it */
			}

			var targetTop = hlCenter - naturalH / 2;
			var shift = targetTop - naturalTop;
			if (Math.abs(shift) < 0.5) {
				return; /* already centered; leave the natural box alone */
			}

			label.style.top = Math.round(shift) + 'px';
		}

		/* taxSetCard / taxSetPreview / taxMoveCard / taxMovePreview / taxMove /
