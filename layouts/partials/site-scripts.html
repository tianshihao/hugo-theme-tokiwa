		   move/jump engine; activeCursor() picks the right pane. */

		function taxDescend() {
			var card = cardCursor.current();
			if (!card) {
				return;
			}
			var previews = taxPreviews(card);
			if (previews.length) {
				/* mark the card as the open parent: after l descends into its
				   previews, the card's label font turns purple-red (the previous
				   layer indicator); ascending / exiting clears it */
				card.classList.add('preview-open');
				previewCursor.select(previews[0]); /* keeps the card highlighted */
			}
		}

		function taxAscend() {
			var card = cardCursor.current();
			if (card) {
				card.classList.remove('preview-open');
				previewCursor.clear();   /* drop the preview, keep the card */
				cardCursor.select(card); /* re-measure + re-scroll the card */
			}
		}

		function taxOpen() {
			var link;
			var previewIndex = null;
			if (previewCursor.current()) {
				link = previewCursor.current();
				var card = cardCursor.current();
				if (card) {
					previewIndex = taxPreviews(card).indexOf(link);
				}
			} else if (cardCursor.current()) {
				link = cardCursor.current().querySelector('[data-home-tag-name] a');
			}
			if (link && link.href) {
				/* remember where we came from so h on the term page / article can
				   restore the same card (and, for a preview, the same title). path
				   uses effectivePath (the shown taxonomy page) — the nav live-
				   preview can show /tags/ while the URL still says /posts/ */
				var openCard = cardCursor.current();
				saveReturnContext({
					path: effectivePath,
					type: 'card',
					cardIndex: openCard ? taxCards().indexOf(openCard) : -1,
					previewIndex: previewIndex,
					href: link.href
				});
				window.location.href = link.href;
			}
		}

		function taxExit() {
			if (previewCursor.current()) {
				taxAscend();
			} else {
				cardCursor.clear();
				previewCursor.clear();
				exitVim();
			}
		}

		/* ---- site navigation bar (the left column of links) ----------------
		   The vim nav has two panes: the site nav (Posts / Tags / Categories /
		   Series / About / RSS) and the content list. h = out/left, l = in/right:
		     list / card level → h enters the nav, l descends into a card
		     preview level     → h ascends out of the card
		     nav               → l returns to the list
		   j/k move within whichever pane has focus; Enter opens; gg/G jump. */
		var navCursor = makeCursor({
			/* site nav: item list cached on first entry; the initial item is the
			   one for the page we're on (currentNavIndex); pill highlight */
			cache: true,
			items: navItems,
			initialIndex: function () {
				return currentNavIndex(navCursor.items());
			},
			onSelect: function (a) {
				if (a.scrollIntoView) {
					a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
				}
			}
		});

		function navItems() {
			/* the home/title link ("笔记本子") is the first nav item, followed by
			   the menu links (Posts / Tags / Categories / Series / About / RSS) */
			var items = [];
			var title = document.querySelector('[data-site-title]');
			if (title && title.offsetParent !== null && title.href) {
				items.push(title);
			}
			var list = document.querySelector('[data-site-nav]');
			if (list) {
				Array.prototype.forEach.call(list.querySelectorAll('li > a'), function (a) {
					if (a.offsetParent !== null && a.href) {
						items.push(a);
					}
				});
			}
			return items;
		}

		/* the nav item for the page we're on: exact or prefix match on the path
		   (e.g. /tags/ and /tags/c++ both map to Tags), so h always returns to
		   the highlighted item for the current page. Falls back to home. */
		function currentNavIndex(list) {
			var path = effectivePath.replace(/\/+$/, '') || '/';
			var best = 0;
			var bestLen = -1;
			list.forEach(function (a, i) {
				var href = (a.getAttribute('href') || '').split('#')[0].replace(/\/+$/, '') || '/';
				var matched = href === '/' ? path === '/' : (path === href || path.indexOf(href + '/') === 0);
				if (matched && href.length > bestLen) {
					best = i;
					bestLen = href.length;
				}
			});
			return best;
		}

		function inNav() {
			return navCursor.current() !== null;
		}

		function navEnter() {
			if (!navCursor.items().length) {
				return;
			}
			enterVim();
			listCursor.clear();   /* leave the list / card / preview panes */
			cardCursor.clear();
			previewCursor.clear();
			navCursor.enter();    /* select the nav item for this page */
			/* h returning to the nav cancels the purple current-page marker —
			   it only shows while IN the content (after a commit), never while
			   navigating the nav */
			clearNavCurrent();
		}

		function navLeave() {
			navCursor.clear();
		}

		/* Move from the nav into the main content (first-level preview pages):
		   leave the nav and select the first content item — the first card on a
		   taxonomy overview, the first post row elsewhere — so l lands with
		   something already highlighted (mirror of h entering the nav and
		   selecting the current page's item). Reading pages (about) have no
		   selectable first item: just leave the nav. */
		function enterMainContent() {
			navLeave();
			if (isTaxonomy()) {
				cardCursor.enter();
			} else if (listCursor.items().length) {
				listCursor.enter();
			}
			/* committing via l: mark the entered page's nav item purple-red */
			updateNavCurrent();
		}

		/* l / Enter from the nav: "enter" the selected nav item. If it's the page
		   we're already on, just return to its content (no reload); otherwise
		   navigate to it. */
		function navOpen() {
			var a = navCursor.current();
			if (!a) {
				return;
			}
			var target = (a.getAttribute('href') || '').split('#')[0].replace(/\/+$/, '');
			var current = window.location.pathname.replace(/\/+$/, '');
			if (target === current) {
				navLeave();
			} else {
				window.location.href = a.href;
			}
		}

		/* ---- nav live-preview: dynamically load the selected page ----------
		   In the nav on a first-level page, moving the cursor (j/k/gg/G) loads
		   the selected page's main + footer into the right pane via fetch — a
		   live preview, not a navigation: the URL never moves. Only non-article
		   destinations are previewable; RSS / external links and articles
		   (about) fall back to highlight-only, and l / Enter navigates there.
		   Each target type re-boots its machinery after the swap
		   (oneScreenPage / taxonomyCards), so the paginated list and the card
		   dividers stay correct. */
		var previewRequestId = 0;

		function isPageHref(href) {
			return !!href && href.indexOf('http') !== 0 && href !== '#' &&
				href.slice(-4) !== '.xml';
		}

		function normalizePath(p) {
			return (p || '').split('#')[0].replace(/\/+$/, '') || '/';
		}

		/* preview the nav item currently under the cursor (called after every
		   nav move / jump on a first-level page). Even the current page's own
		   item is re-fetched: after previewing other pages the main no longer
		   shows it, so moving back must restore it. */
		function previewSelectedNav() {
			var a = navCursor.current();
			if (!a || !isFirstLevel()) {
				return;
			}
			var href = (a.getAttribute('href') || '').split('#')[0];
			if (!isPageHref(href)) {
				return;
			}
			previewNavTo(href);
		}

		function previewNavTo(href) {
			var reqId = ++previewRequestId;
			return fetch(href).then(function (res) {
				if (!res.ok) { throw new Error('preview ' + res.status); }
				return res.text();
			}).then(function (html) {
				/* a newer j/k superseded this one — drop it */
				if (reqId !== previewRequestId) { return false; }
				var doc = new DOMParser().parseFromString(html, 'text/html');
				var newMain = doc.querySelector('[data-home-main]');
				if (!newMain) { return false; }
				var bodyClass = (doc.body && doc.body.getAttribute('class')) || '';
				if (bodyClass.indexOf('is-article') !== -1) {
					return false; /* articles keep a real navigation */
				}
				var newFooter = doc.querySelector('[data-home-footer]');
				applyPreview(newMain.innerHTML, newFooter ? newFooter.innerHTML : '',
					bodyClass.indexOf('home-one-screen') !== -1, normalizePath(href));
				return true;
			}).catch(function () {
				return false;
			});
		}

		function applyPreview(mainHTML, footerHTML, oneScreen, path) {
			var mainEl = document.querySelector('[data-home-main]');
			var footerEl = document.querySelector('[data-home-footer]');
			if (!mainEl) { return; }
			effectivePath = path || window.location.pathname;
			/* note: updateNavCurrent() is NOT called here — j/k previews load the
			   content but must not turn the nav item purple; only a commit (l /
			   mouse click) marks it purple-red. */

			/* leave the current page's machinery behind */
			if (document.body.classList.contains('home-one-screen')) {
				oneScreenPage.teardown();
			}
			document.body.classList.remove('home-one-screen');
			document.body.classList.remove('is-article');
			listCursor.clear();
			cardCursor.clear();
			previewCursor.clear();

			/* swap in the target's content */
			mainEl.innerHTML = mainHTML;
			if (footerEl) { footerEl.innerHTML = footerHTML; }

			/* boot the target's machinery */
			if (oneScreen) {
				document.body.classList.add('home-one-screen');
				oneScreenPage.boot();
			} else if (document.querySelector('[data-taxonomy-cards] > section')) {
				taxonomyCards.boot();
			}
			window.scrollTo(0, 0);
		}

		/* remove the purple-red current-page marker from every nav link. Called
		   when h returns to the nav: the purple only ever shows while IN the
		   content (after a commit), never while navigating the nav. */
		function clearNavCurrent() {
			var list = document.querySelector('[data-site-nav]');
			if (!list) { return; }
			Array.prototype.forEach.call(list.querySelectorAll('li > a'), function (a) {
				a.classList.remove('font-medium', 'text-medium-red-violet-600');
			});
		}

		/* mirror the template's "current page" nav styling (font-medium +
		   text-medium-red-violet-600) onto the nav item whose page is currently
		   shown, so a dynamically-loaded preview looks identical to a real page
		   load. The template colours by the URL at render time; here we colour by
		   effectivePath (the shown content) after every swap. */
		function updateNavCurrent() {
			var path = effectivePath.replace(/\/+$/, '') || '/';
			var list = document.querySelector('[data-site-nav]');
			if (!list) { return; }
			Array.prototype.forEach.call(list.querySelectorAll('li > a'), function (a) {
				var href = (a.getAttribute('href') || '').split('#')[0].replace(/\/+$/, '') || '/';
				var isCurrent = href === path;
				a.classList.toggle('font-medium', isCurrent);
				a.classList.toggle('text-medium-red-violet-600', isCurrent);
			});
		}

		/* ---- commit a nav item: dynamic load like a click -------------------
		   The shared action behind a mouse click AND the g-leader commands
		   (gh/gp/gt/gc/gs) — the g-leader is fully equivalent to clicking the
		   corresponding nav element. Loading the target's main + footer into
		   the right pane via the same fetch + swap as j/k/gg/G: no navigation,
		   the URL never moves. The action moves the vim nav cursor if it is
		   active (vim state persists through the mouse), and commits by marking
		   the loaded page's nav item purple-red. RSS / external links and
		   non-previewable targets (articles / 404) fall back to a real
		   navigation; on deeper pages the g-leader/click keeps a real
		   navigation too. */
		function openNavItem(a) {
			var href = (a.getAttribute('href') || '').split('#')[0];
			if (!isPageHref(href) || !isFirstLevel()) {
				/* leaving for a different top-level page: a pending vim return no
				   longer applies (this navigation supersedes the h-back) */
				clearReturnContext();
				window.location.href = a.href; /* default navigation */
				return;
			}
			if (navCursor.current()) {
				navCursor.select(a); /* keep the vim highlight coherent */
			}
			previewNavTo(href).then(function (applied) {
				if (!applied) {
					/* article / 404: preview skipped, go there for real */
					clearReturnContext();
					window.location.href = a.href;
					return;
				}
				/* committing: mark the loaded page's nav item purple-red, and drop
				   the :focus the browser left on the link so it shows right away */
				updateNavCurrent();
				if (document.activeElement && document.activeElement.blur) {
					document.activeElement.blur();
				}
			});
		}

		/* find the nav element whose destination matches a route target, so the
		   g-leader can act on the exact link a click would have hit */
		function navItemForHref(target) {
			var t = normalizePath(target);
			var title = document.querySelector('[data-site-title]');
			if (title && normalizePath(title.getAttribute('href') || '') === t) {
				return title;
			}
			var list = document.querySelector('[data-site-nav]');
			if (list) {
				var arr = Array.prototype.slice.call(list.querySelectorAll('li > a'));
				for (var i = 0; i < arr.length; i++) {
					if (normalizePath(arr[i].getAttribute('href') || '') === t) {
						return arr[i];
					}
				}
			}
			return null;
		}

		function wireNavClicks() {
			var links = [];
			var title = document.querySelector('[data-site-title]');
			if (title && title.href) { links.push(title); }
			var list = document.querySelector('[data-site-nav]');
			if (list) {
				Array.prototype.forEach.call(list.querySelectorAll('li > a'), function (a) {
					links.push(a);
				});
			}
			links.forEach(function (a) {
				a.addEventListener('click', function (e) {
					if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) {
						return; /* middle / modified click: let the browser open it */
					}
					e.preventDefault();
					openNavItem(a);
				});
			});
		}
		wireNavClicks();

		/* A "first-level" page is exactly one of the nav destinations (home /
		   posts / tags / categories / series / about), so the nav can
		   live-preview it. Term pages, articles and 404 are deeper: the nav only
		   highlights and l / Enter still navigates there. */
		function isFirstLevel() {
			var path = window.location.pathname.replace(/\/+$/, '') || '/';
			return navItems().some(function (a) {
				var href = (a.getAttribute('href') || '').split('#')[0].replace(/\/+$/, '') || '/';
				return href === path;
			});
		}

		/* ---- reading view (single article): j/k scroll, gg/G top/bottom ------
		   The article is the deepest node of the tree — it has no list, so j/k
		   become smooth scrolling instead of item movement, modelled as a car at
		   constant velocity from the very first frame (no initial burst):
		     - a quick tap glides one fixed READ_TAP chunk (constant velocity),
		     - holding keeps the same constant velocity, releasing stops instantly.
		   READ_TAP is fixed, independent of article length. */
		var READ_TAP = 300;      /* px a tap glides (fixed, ~1/4 viewport) */
		var READ_SPEED = 7;      /* px per frame base velocity (~420px/s) for j/k */
		var READ_FAST = 5;       /* d/u scroll at this many × j/k speed */
		var READ_TAP_MS = 160;   /* held longer than this = a hold, not a tap */
		var readDir = 0;
		var readRaf = 0;
		var readMoved = 0;
		var readDownAt = 0;
		var readLast = 0;
		var readSpeed = 1;       /* current speed multiplier (1 = j/k, READ_FAST = d/u) */
		var readFinishingTap = false;

		/* a single article page — the only "reading" page. The check keys off
		   .c-rich-text (unique to single.html): terms.html / list.html / 404
		   also render an <article>, but those are content wrappers, not posts.
		   On a terms page with no terms (e.g. /categories/ when nothing is
		   categorized) that empty <article> must not flip us into reading
		   mode, or j/k would scroll instead of navigating the nav / cards. */
		function isReading() {
			return !!document.querySelector('article .c-rich-text');
		}

		function readStart(dir, mult) {
			readDir = dir;
			readSpeed = mult;
			readMoved = 0;
			readFinishingTap = false;
			readDownAt = Date.now();
			readLast = 0;
			if (!readRaf) {
				readRaf = requestAnimationFrame(readLoop);
			}
		}

		/* time-based constant velocity: each frame scrolls by the real elapsed
		   time, so the speed is constant even if the frame rate wobbles */
		function readLoop(now) {
			if (readDir === 0) {
				readRaf = 0;
				return;
			}
			var dt = readLast ? Math.min(50, now - readLast) : 16;
			readLast = now;
			var step = READ_SPEED * readSpeed * dt / 16.67;
			window.scrollBy(0, readDir * step);
			readMoved += step;
			if (readFinishingTap && readMoved >= READ_TAP) {
				readDir = 0; /* the quick-tap chunk is complete */
				readRaf = 0;
				return;
			}
			readRaf = requestAnimationFrame(readLoop);
		}

		function readStop() {
			/* a quick tap (released before READ_TAP_MS) glides a full READ_TAP
			   chunk at constant velocity, then stops itself; anything held longer
			   is a hold → stop right now (the car model) */
			if (Date.now() - readDownAt < READ_TAP_MS && readMoved < READ_TAP) {
				readFinishingTap = true;
			} else {
				readDir = 0;
				if (readRaf) {
					cancelAnimationFrame(readRaf);
					readRaf = 0;
				}
			}
		}

		function readScrollTo(edge) {
			/* gg / G in the article: jump instantly, no animation */
			window.scrollTo({
				top: edge === 'top' ? 0 : document.documentElement.scrollHeight,
				behavior: 'auto'
			});
		}

		function resetLeader() {
			leader = false;
			clearTimeout(leaderTimer);
			leaderTimer = null;
		}

		/* ---- posts/home list cursor & vim mode ----------------------------
		   visibleItems() / listCursor (the unified cursor over the posts & home
		   rows) plus enterVim / exitVim — the vim-mode class switch, the
		   :focus blur, and the motion-stop when leaving. Only the
		   currently-rendered items are listed (hidden home-fit-hidden pages and
		   draft rows are display:none → offsetParent is null, so skip them). */
		function visibleItems() {
			return Array.prototype.slice
				.call(document.querySelectorAll('[data-home-post-item]'))
				.filter(function (el) { return el.offsetParent !== null; });
		}

		var listCursor = makeCursor({
			/* posts / home list: live visible rows; measured overlay highlight */
			items: visibleItems,
			onSelect: function (item) {
				var b = measureBounds(item);
				item.style.setProperty('--hl-top', b.top + 'px');
				item.style.setProperty('--hl-bottom', b.bottom + 'px');
				if (item.scrollIntoView) {
					item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
				}
			}
		});

		/* Leave vim list navigation: drop every highlight (list row, taxonomy
		   card/preview, site nav) and the body.vim-nav class, so the layout
		   animates back to the original flush state. */
		function exitVim() {
			/* leaving keyboard mode also stops any in-flight motion (a j/k hold
			   or a reading scroll), so the next move() can't re-highlight */
			listRepeatStop();
			readStop();
			listCursor.clear();
			cardCursor.clear();
			previewCursor.clear();
			navCursor.clear();
			/* drop any open-preview marker (the card label's purple font) */
			Array.prototype.forEach.call(document.querySelectorAll('.preview-open'), function (el) {
				el.classList.remove('preview-open');
			});
			/* undo the tag-pill centering so the layout returns to natural */
			Array.prototype.forEach.call(document.querySelectorAll('[data-home-tag-name] .tag-label'), function (el) {
				el.style.position = '';
				el.style.top = '';
			});
			document.body.classList.remove('vim-nav');
		}

		/* Enter list navigation: switch the rows to the inset "selection mode".
		   Also drop any :focus the mouse/keyboard left on a link — otherwise its
		   focus color/underline (same family as the hover tone) would fight the
		   vim-active highlight. */
		function enterVim() {
			document.body.classList.add('vim-nav');
			if (document.activeElement && document.activeElement.blur) {
				document.activeElement.blur();
			}
		}

		function openActive() {
			var item = listCursor.current();
			if (!item) {
				return;
			}
			var link = findOpenLink(item);
			if (link) {
				/* remember where we came from so h on the article can restore the
				   same page, page-number and highlighted row. path uses
				   effectivePath — the page actually shown (home / posts / term), not
				   the URL — because the nav live-preview can show one first-level
				   page while the URL still says another */
				saveReturnContext({
					path: effectivePath,
					type: 'list',
					page: oneScreenPage.currentPageIndex(),
					index: visibleItems().indexOf(item),
					href: link.href
				});
				window.location.href = link.href;
			}
		}

		/* ---- list repeat: holding j/k inside a list (nav / posts / taxonomy)
		   The OS fires the first keydown instantly, then waits ~500ms before its
		   repeats — the "first move, then stall" the user felt. Like the reading
		   view, the hold is driven by our own rAF accumulator at a constant
		   cadence (one item every LIST_REPEAT_MS), so there is no gap after the
		   first move and releasing stops instantly. OS repeats (e.repeat) are
		   ignored — they would only duplicate the loop. */
		var LIST_REPEAT_MS = 180; /* per-item cadence while j/k is held (midpoint of the original 120 and the halved 240) */
		var listDir = 0;          /* 0 = idle, +1 down, -1 up */
		var listRaf = 0;
		var listAcc = 0;
		var listLast = 0;

		/* the pane under the cursor at any moment: nav → card preview → cards →
		   list (preview implies a card, which implies a taxonomy page) */
		function activeCursor() {
			if (inNav()) {
				return navCursor;
			}
			if (previewCursor.current()) {
				return previewCursor;
			}
			if (isTaxonomy()) {
				return cardCursor;
			}
			return listCursor;
		}

		function listMove(step) {
			activeCursor().move(step);
			/* in the nav on a first-level page, moving the cursor previews the
			   selected page into the right pane (j/k, the hold-repeat and
			   gg/G all go through here) */
			if (inNav() && isFirstLevel()) {
				previewSelectedNav();
			}
		}

		function listLoop(now) {
			if (listDir === 0) {
				listRaf = 0;
				return;
			}
			var dt = listLast ? Math.min(100, now - listLast) : 16;
			listLast = now;
			listAcc += dt;
			if (listAcc >= LIST_REPEAT_MS) {
				listAcc = 0;
				listMove(listDir);
			}
			listRaf = requestAnimationFrame(listLoop);
		}

		function listRepeatStart(step) {
			listDir = step;
			listAcc = 0;
			listLast = 0;
			if (!listRaf) {
				listRaf = requestAnimationFrame(listLoop);
			}
		}

		function listRepeatStop() {
			listDir = 0;
			listAcc = 0;
			listLast = 0;
			if (listRaf) {
				cancelAnimationFrame(listRaf);
				listRaf = 0;
			}
		}

		/* ---- vim return: h on a leaf restores the page it came from ----------
		   The tree's leaves (articles) and the taxonomy term pages sit one level
		   below a list (home / posts / term) or a card (tags / categories /
		   series) page. Leaving one of those (l / Enter, or a mouse click on the
		   item) is a real navigation, so the vim state would be lost — before
		   leaving we save where we came from and which item was highlighted; on
		   the target, h goes back there and re-selects the same item. The
		   context survives the real navigation in sessionStorage (per-tab, not
		   across tabs) and is cleared once the return is applied. */
		var RETURN_KEY = 'tokiwa.vimReturn';

		/* A single return context: where the current leaf (an article) came from,
		   saved on the real navigation down and cleared once the return is
		   applied. A taxonomy term page does NOT need a saved context — its own
		   URL (/tags/c++/) already tells us its parent first-level page (/tags/)
		   and which card (the C++ card), so h from a term page derives them
		   directly in returnToSource() instead. Only an article is opaque, so it
		   carries the context. */
		function saveReturnContext(ctx) {
			try {
				sessionStorage.setItem(RETURN_KEY, JSON.stringify(ctx));
			} catch (e) { /* private mode / quota: just no return feature */ }
		}

		function readReturnContext() {
			try {
				var raw = sessionStorage.getItem(RETURN_KEY);
				return raw ? JSON.parse(raw) : null;
			} catch (e) {
				return null;
			}
		}

		/* consume the context once the return has been applied */
		function popReturnContext() {
			try { sessionStorage.removeItem(RETURN_KEY); } catch (e) {}
		}

		/* drop the context (e.g. leaving for a different first-level page) */
		function clearReturnContext() {
			try { sessionStorage.removeItem(RETURN_KEY); } catch (e) {}
		}

		function currentPathNoSlash() {
			return window.location.pathname.replace(/\/+$/, '') || '/';
		}

		/* A first-level page is one of the nav destinations. Its content is only
		   ever loaded inside the home page (the nav live-preview / a vim-return)
		   — it never appears on its own URL during navigation. Only deeper
		   content pages (articles, taxonomy term pages) are reached by a real
		   navigation, so h returns to them directly but returns to a first-level
		   page by landing on home (/). */
		var FIRST_LEVEL_PATHS = ['/', '/posts', '/tags', '/categories', '/series', '/about'];

		function isFirstLevelPath(p) {
			var t = String(p || '').replace(/\/+$/, '') || '/';
			return FIRST_LEVEL_PATHS.indexOf(t) !== -1;
		}

		/* a taxonomy term page's path (/tags/c++ → /tags + the C++ card). The
		   parent first-level page is derivable from the URL, so a term page never
		   needs a saved context to know where it came from. */
		function taxonomyFromTermPath(path) {
			var seg = String(path || '').split('/').filter(Boolean);
			if (seg.length >= 2 && (seg[0] === 'tags' || seg[0] === 'categories' || seg[0] === 'series')) {
				return { taxPath: '/' + seg[0], termHref: '/' + seg[0] + '/' + seg[1] };
			}
			return null;
		}

		/* h on a leaf / term page: navigate back one level. On a taxonomy term
		   page the parent first-level page is derived from the URL itself; on an
		   article it comes from the saved context. A first-level page never lands
		   on its own URL — it lands on home (/), which loads the page's content
		   into the right pane (applyReturnRestore). Returns true if a return
		   happened; false lets the caller fall back to entering the nav. */
		function returnToSource() {
			var tax = taxonomyFromTermPath(currentPathNoSlash());
			if (tax) {
				/* record the derived parent + card so the home page can load the
				   taxonomy overview and re-select the exact card we came from */
				saveReturnContext({ path: tax.taxPath, type: 'card', termHref: tax.termHref });
				if (currentPathNoSlash() === '/') {
					return false;
				}
				window.location.href = '/';
				return true;
			}
			var ret = readReturnContext();
			if (!ret || !ret.path) {
				return false;
			}
			/* normalize defensively: stale contexts may carry a trailing slash */
			var there = String(ret.path).replace(/\/+$/, '') || '/';
			if (currentPathNoSlash() === there) {
				return false; /* already there (e.g. a stale context) */
			}
			if (isFirstLevelPath(there)) {
				if (currentPathNoSlash() === '/') {
					return false; /* already home */
				}
				window.location.href = '/';
			} else {
				window.location.href = there === '/' ? '/' : there + '/';
			}
			return true;
		}

		/* run a callback after the page's machinery has settled (the one-screen
		   pagination builds its pages inside a rAF chain) */
		function afterFrames(count, cb) {
			function tick() {
				if (--count <= 0) {
					cb();
				} else {
					requestAnimationFrame(tick);
				}
			}
			requestAnimationFrame(tick);
		}

		/* re-select the item (list row / card / card preview) the return context
		   recorded, and re-enter vim mode so the state matches what it was
		   before. Pops this one level afterwards, so a later h on this page
		   returns to the next level up (term → home's first-level content → nav). */
		function restoreCursor(ret) {
			if (ret.type === 'list') {
				afterFrames(3, function () {
					if (typeof ret.page === 'number') {
						oneScreenPage.restorePage(ret.page);
					}
					var items = visibleItems();
					var target = null;
					if (ret.href) {
						for (var i = 0; i < items.length; i += 1) {
							var link = findOpenLink(items[i]);
							if (link && link.href === ret.href) {
								target = items[i];
								break;
							}
						}
					}
					if (!target && typeof ret.index === 'number' && items[ret.index]) {
						target = items[ret.index];
					}
					if (target) {
						listCursor.select(target);
						enterVim();
					}
					/* the returned-to page is a committed page — mark its nav item
					   purple-red (applyPreview only loads the content, so the
					   current-page indicator would otherwise be missing) */
					updateNavCurrent();
					popReturnContext();
				});
			} else if (ret.type === 'card') {
				afterFrames(2, function () {
					var cards = taxCards();
					var card = null;
					/* a term-derived context carries the tag link href; match the
					   exact card that way (names can differ in case, e.g. C++ vs c++) */
					if (ret.termHref) {
						var want = String(ret.termHref).replace(/\/+$/, '');
						for (var t = 0; t < cards.length; t += 1) {
							var link = cards[t].querySelector('[data-home-tag-name] a');
							if (link && (link.getAttribute('href') || '').replace(/\/+$/, '') === want) {
								card = cards[t];
								break;
							}
						}
					}
					if (!card && typeof ret.cardIndex === 'number' && cards[ret.cardIndex]) {
						card = cards[ret.cardIndex];
					}
					if (card) {
						cardCursor.select(card);
						if (typeof ret.previewIndex === 'number') {
							card.classList.add('preview-open');
							var previews = taxPreviews(card);
							var preview = previews[ret.previewIndex];
							if (preview) {
								previewCursor.select(preview);
							}
						}
						enterVim();
					}
					/* the returned-to page is a committed page — mark its nav item
					   purple-red (applyPreview only loads the content, so the
					   current-page indicator would otherwise be missing) */
					updateNavCurrent();
					popReturnContext();
				});
			}
		}

		/* apply a saved return context on the page we landed back on. The target
		   of a return is always home (/): a first-level page is only ever shown
		   inside home, so if the saved path is a first-level page other than home
		   we load its content into the right pane first (SPA), then restore the
		   cursor. If we landed on a real term page (matching the saved path), the
		   content is already there and we just restore. Contexts for other pages
		   (e.g. the leaf itself) are left pending for the actual return target. */
		function applyReturnRestore() {
			var ret = readReturnContext();
			if (!ret) {
				return;
			}
			var there = String(ret.path || '').replace(/\/+$/, '') || '/';
			var here = currentPathNoSlash();
			if (here !== '/' && here !== there) {
				return; /* still pending on a leaf / another page */
			}
			if (here === '/') {
				if (there === '/' || there === here) {
					restoreCursor(ret);
				} else if (isFirstLevelPath(there)) {
					/* load the saved first-level page's content into the right pane
					   (home stays the URL), then restore the cursor on it */
					previewNavTo(there + '/').then(function (applied) {
						if (applied) {
							restoreCursor(ret);
						} else {
							popReturnContext(); /* unexpected: not previewable */
						}
					});
				} else {
					popReturnContext(); /* stale */
				}
				return;
			}
			/* here === there (a real term page): restore directly */
			restoreCursor(ret);
		}

		/* exposed so the load-time boot block can apply a pending return */
		window.tokiwaApplyReturnRestore = applyReturnRestore;

		/* mouse parity: clicking a post row / card label / card preview also
		   records where we came from, so h on the target restores it exactly
		   like the keyboard path. The click itself is not intercepted — it
		   navigates as usual, with the return context recorded for the h back. */
		window.addEventListener('click', function (e) {
			if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) {
				return;
			}
			var el = e.target;
			var a = el && el.closest ? el.closest('a') : null;
			if (!a || !a.href) {
				return;
			}
			if (!isPageHref(a.getAttribute('href') || '')) {
				return;
			}
			var item = a.closest('[data-home-post-item]');
			if (item) {
				/* path uses effectivePath (the page actually shown) so clicking a
				   home / posts / term row while another page is previewed still
				   returns to the right one */
				saveReturnContext({
					path: effectivePath,
					type: 'list',
					page: oneScreenPage.currentPageIndex(),
					index: visibleItems().indexOf(item),
					href: a.href
				});
				return;
			}
			var card = a.closest('[data-taxonomy-cards] > section');
			if (card) {
				var ctx = {
					path: effectivePath,
					type: 'card',
					cardIndex: taxCards().indexOf(card),
					href: a.href
				};
				var preview = a.parentElement && a.parentElement.classList.contains('tag-card-titles') ? a : null;
				if (preview) {
					ctx.previewIndex = taxPreviews(card).indexOf(a);
				}
				saveReturnContext(ctx);
			}
		}, true);

		/* ---- vim input dispatch (keyboard & mouse) ------------------------
		   The global keydown / keyup / resize handlers that run the engine:
		   IME-safe key capture (e.isComposing / keyCode 229), leader keys,
		   j/k/G/h/l/Enter/gg, ,/. pager, / search, Esc / Ctrl+C exit. The mouse
		   is fully independent — vim state is remembered, no pointer event
		   exits it. */
		window.addEventListener('keydown', function (e) {
			var t = e.target;
			var tag = t && t.tagName ? t.tagName.toLowerCase() : '';
			if (tag === 'input' || tag === 'textarea' || tag === 'select' ||
				(t && t.isContentEditable)) {
				return; /* typing — never hijack */
			}
			/* IME composition (e.g. Chinese pinyin): skip so vim never acts on
			   half-composed input. When an IME is merely enabled but not composing,
			   e.key still reports the physical key, so vim works normally. */
			if (e.isComposing || e.keyCode === 229) {
				return;
			}
			var rawKey = e.key;
			var key = rawKey.toLowerCase();

			/* Ctrl+C exits vim list navigation (same as Esc); never hijack copy —
			   the input guard above already returned while typing in a field. */
			if (e.ctrlKey && key === 'c' && document.body.classList.contains('vim-nav')) {
				e.preventDefault();
				exitVim();
				return;
			}

			if (e.ctrlKey || e.metaKey || e.altKey) {
				resetLeader();
				return;
			}

			/* if the leader is armed, this key completes a leader sequence
			   (checked before the plain-g trigger so gg works) */
			if (leader) {
				resetLeader();
				if (rawKey === 'g') { /* gg: jump to the first */
					e.preventDefault();
					enterVim();
					if (isReading() && !inNav()) {
						readScrollTo('top');
					} else {
						activeCursor().jump('first');
						previewSelectedNav();
					}
					return;
				}
				var target = routes[key];
				if (!target) {
					return;
				}
				e.preventDefault();
				/* gh/gp/gt/gc/gs = click that nav element: dynamic-load its
				   content into the right pane, never navigate */
				var a = navItemForHref(target);
				if (a) {
					openNavItem(a);
				}
				return;
			}

			/* lowercase g starts the leader (gg = first row); shift+G = last row */
			if (rawKey === 'g' && !e.repeat) {
				leader = true;
				clearTimeout(leaderTimer);
				leaderTimer = setTimeout(resetLeader, 1200);
				e.preventDefault(); /* dead key until the second press */
				return;
			}

			/* j/k / G / h/l: list navigation. On the taxonomy (tags) page this
			   moves between cards (and inside a card, between previews after l);
			   on home/posts it moves the post list. Enter opens, Esc / Ctrl+C
			   exit. body.vim-nav lets the CSS inset the rows for breathing room. */
			if (key === 'j' || key === 'k') {
				e.preventDefault();
				enterVim();
				var step = key === 'j' ? 1 : -1;
				/* in the nav the cursor belongs to the nav pane, even on a
				   reading page (about) — the nav preview takes priority */
				if (isReading() && !inNav()) {
					if (!e.repeat) {
						readStart(step, 1); /* constant velocity from the first frame */
					}
					/* OS repeats add nothing — the loop keeps the same constant
					   velocity, so there is no second tap and no pause */
				} else if (!e.repeat) {
					/* list contexts (nav / posts / taxonomy): the first press
					   moves one item, then the rAF loop keeps stepping at a
					   constant cadence while the key is held — no OS-repeat gap.
					   OS repeats (e.repeat) are ignored: they only duplicate
					   the loop. In the nav on a first-level page each move
					   previews the selected page into the right pane (listMove). */
					listMove(step);
					listRepeatStart(step);
				}
			} else if ((key === 'd' || key === 'u') && isReading()) {
				/* fast scroll inside the article: d = down, u = up, at READ_FAST × j/k */
				e.preventDefault();
				enterVim();
				if (!e.repeat) {
					readStart(key === 'd' ? 1 : -1, READ_FAST);
				}
			} else if (rawKey === 'G') { /* shift+g: jump to the last */
				e.preventDefault();
				enterVim();
				if (isReading() && !inNav()) {
					readScrollTo('bottom');
				} else {
					activeCursor().jump('last');
					previewSelectedNav();
				}
			} else if (key === 'l') { /* right / in: nav → page, card → previews, leaf → open */
				e.preventDefault();
				enterVim();
				if (inNav()) {
					/* first-level: j/k already entered the page, so l just moves
					   the cursor into the main content and selects its first item */
					if (isFirstLevel()) { enterMainContent(); } else { navOpen(); }
				} else if (isTaxonomy() && cardCursor.current() && !previewCursor.current()) {
					taxDescend();
				} else if (isTaxonomy() && previewCursor.current()) {
					taxOpen(); /* leaf: open the preview */
				} else if (listCursor.current()) {
					openActive(); /* leaf: open the post */
				}
			} else if (key === 'h') { /* left / out: preview → card, leaf/term → back, list/card → nav */
				e.preventDefault();
				enterVim();
				if (inNav()) {
					/* already at the leftmost pane */
				} else if (isTaxonomy() && previewCursor.current()) {
					taxAscend();
				} else if (returnToSource()) {
					/* on a leaf / term page reached from a list or card: h goes back
					   to that page and restores the cursor there (returnToSource
					   handled the navigation; no navEnter) */
				} else {
					navEnter();
				}
			} else if (e.code === 'Comma' || e.code === 'Period') {
				/* page back / forward (home & posts pager). Matched on the PHYSICAL
				   key (e.code), not e.key: with a Chinese IME active, the , and .
				   keys emit ，。 through e.key, which would never match. e.code
				   reports the keyboard position regardless of IME. */
				var pager = document.querySelector('[data-home-pager]');
				var dir = e.code === 'Comma' ? 'prev' : 'next';
				var pageLink = pager ? pager.querySelector('[data-home-' + dir + ']') : null;
				var pageLi = pageLink ? pageLink.closest('li') : null;
				if (pageLink && pageLi && !pageLi.classList.contains('disabled')) {
					e.preventDefault();
					enterVim();
					pageLink.click();
				}
			} else if (key === '/' && !inNav()) { /* focus the site search box */
				e.preventDefault();
				var search = document.getElementById('searchInput');
				if (search) {
					exitVim();
					search.focus();
				}
			} else if (key === 'enter' && (listCursor.current() || isTaxonomy() || inNav())) {
				e.preventDefault();
				if (inNav()) {
					if (isFirstLevel()) { enterMainContent(); } else { navOpen(); }
				} else if (isTaxonomy()) {
					taxOpen();
				} else {
					openActive();
				}
			} else if (key === 'escape') {
				if (inNav()) {
					navLeave();
					exitVim();
				} else if (isTaxonomy()) {
					taxExit();
				} else {
					exitVim();
				}
			}
		}, true); /* capture phase: catch keys even if an inner element stops them */

		/* releasing a scroll key stops the reading-view scroll (or starts the tap
		   glide) and stops the list j/k repeat; covers j/k/d/u and their shifted
		   variants */
		window.addEventListener('keyup', function (e) {
			var k = e.key;
			if (k === 'j' || k === 'k' || k === 'J' || k === 'K' ||
				k === 'd' || k === 'D' || k === 'u' || k === 'U') {
				readStop();
				listRepeatStop();
			}
		}, true);

		/* keep the highlight bounds in sync when the window is resized */
		window.addEventListener('resize', function () {
			var item = listCursor.current();
			if (item) {
				listCursor.select(item);
			}
			var card = cardCursor.current();
			if (card) {
				var b = taxMeasureBounds(card);
				card.style.setProperty('--hl-top', b.top + 'px');
				card.style.setProperty('--hl-bottom', b.bottom + 'px');
				syncTagPill(card, b);
			}
		});

		/* keep the highlight bounds in sync when the window is resized */
		window.addEventListener('resize', function () {
			var item = listCursor.current();
			if (item) {
				listCursor.select(item);
			}
			var card = cardCursor.current();
			if (card) {
				var b = taxMeasureBounds(card);
				card.style.setProperty('--hl-top', b.top + 'px');
				card.style.setProperty('--hl-bottom', b.bottom + 'px');
				syncTagPill(card, b);
			}
		});
	})();

	/* Bring keyboard focus into the page so the vim keys work immediately. The
	   embedded browser (VS Code webview) keeps focus on the editor until the
	   user clicks inside; focusing the body claims the keyboard without
	   disturbing the search box (which only takes focus when clicked). */
	(function () {
		function focusBody() {
			if (document.body) {
				document.body.setAttribute('tabindex', '-1');
				document.body.focus({ preventScroll: true });
			}
		}
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', focusBody);
		} else {
			focusBody();
		}
		window.addEventListener('load', focusBody);
	})();

	/* Boot the current page's machinery. The one-screen (home / posts / term)
	   and taxonomy-card (tags / categories / series) modules run once at load;
	   the nav live-preview re-boots them after swapping in new content. */
	(function () {
		if (document.body.classList.contains('home-one-screen')) {
			oneScreenPage.boot();
		} else if (document.querySelector('[data-taxonomy-cards] > section')) {
			taxonomyCards.boot();
		}
		/* h on a leaf restores the page it came from: if we just returned to a
		   list / card page, put the cursor back where it was */
		if (window.tokiwaApplyReturnRestore) {
			window.tokiwaApplyReturnRestore();
		}
	})();
</script>
